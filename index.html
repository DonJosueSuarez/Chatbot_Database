<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Chatbot Triple A</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script></head>
<body>
    <div class="Contenedor">
        <article class="Presentacion">
            <h1>Chatbot Triple A</h1>
            <img src="https://png.pngtree.com/png-vector/20240824/ourmid/pngtree-ai-chatbot-png-image_13604462.png" alt="">
            <p>Bienvenido a Chatbot Triple A, te ayudaré respondiendo preguntas sobre tu negocio 🤖</p>
        </article>
        <article class="ChatContainer">
            <div id="chat-window" class="chat-window">
                <!-- Mensajes del chat aparecerán aquí -->
            </div>
            <form id="chat-form" class="chat-form">
                <input type="text" id="user-input" placeholder="Escribe tu pregunta..." autocomplete="off" required />
                <div class="dropdown" style="position:relative;">
                  <button type="button" id="dropdown-btn" style="padding:6px 12px;border-radius:8px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer;color:#111;font-weight:300;">Tipo de Gráfico 🔼</button>
                  <div id="dropdown-content" style="display:none;position:absolute;z-index:10;background:#fff;border:1px solid #ccc;padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);min-width:140px;bottom:110%;left:0;">
                    <label><input type="checkbox" class="plot-type" value="bar"> Barras</label><br>
                    <label><input type="checkbox" class="plot-type" value="pie"> Pastel</label><br>
                    <label><input type="checkbox" class="plot-type" value="line"> Línea</label><br>
                    <label><input type="checkbox" class="plot-type" value="scatter"> Dispersión</label>
                  </div>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </article>
    </div>
    <script>
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    // Dropdown
    const dropdownBtn = document.getElementById('dropdown-btn');
    const dropdownContent = document.getElementById('dropdown-content');
    dropdownBtn.onclick = function(e) {
      e.preventDefault();
      dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
    };
    document.addEventListener('click', function(e) {
      if (!dropdownBtn.contains(e.target) && !dropdownContent.contains(e.target)) {
        dropdownContent.style.display = 'none';
      }
    });
    // Solo permitir un checkbox seleccionado a la vez
    document.querySelectorAll('.plot-type').forEach(cb => {
      cb.addEventListener('change', function() {
        if (this.checked) {
          document.querySelectorAll('.plot-type').forEach(other => {
            if (other !== this) other.checked = false;
          });
        }
      });
    });

    function addMessage(sender, text, imageBase64 = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = sender === 'user' ? 'msg user' : 'msg bot';
        let html;
        if (sender === 'bot') {
            // Mostrar primero el gráfico y luego el texto
            html = '';
            if (imageBase64) {
                html += `<img class="chat-plot" src="data:image/png;base64,${imageBase64}" alt="Gráfico generado" /><br>`;
            }
            html += `<span class="msg-content">${marked.parse(text)}</span>`;
        } else {
            html = `<span class="msg-content">${text}</span>`;
        }
        msgDiv.innerHTML = html;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = userInput.value.trim();
        if (!question) return;
        addMessage('user', question);
        userInput.value = '';
        addMessage('bot', '<span class="typing">Escribiendo...</span>');
        // Obtener tipo de gráfico seleccionado
        const plotType = (document.querySelector('.plot-type:checked') || {}).value || null;
        try {
            const res = await fetch('http://127.0.0.1:8000/human_query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ human_query: question, plot_type: plotType })
            });
            const data = await res.json();
            // Elimina el mensaje de "Escribiendo..."
            chatWindow.removeChild(chatWindow.lastChild);
            if (data.answer) {
                addMessage('bot', data.answer, data.image_base64);
            } else if (data.error) {
                addMessage('bot', `<span class="error">${data.error}</span>`);
            } else {
                addMessage('bot', '<span class="error">Error inesperado</span>');
            }
        } catch (err) {
            chatWindow.removeChild(chatWindow.lastChild);
            addMessage('bot', '<span class="error">Error de conexión</span>');
        }
    });
    </script>
</body>
</html>
